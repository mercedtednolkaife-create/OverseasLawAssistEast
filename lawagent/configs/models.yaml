# 大模型供应商与任务路由配置 (DashScope 官方标准协议)
default_provider: dashscope

providers:
  dashscope:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "OPENAI_API_KEY"

tasks:
  extract:
    provider: dashscope
    model: "deepseek-v3"
    fallback_model: "qwen-plus"
    temperature: 0.0
    timeout: 25

  reformulate:
    provider: dashscope
    model: "deepseek-v3"
    fallback_model: "qwen-plus"
    temperature: 0.2
    timeout: 25

  translate:
    provider: dashscope
    model: "deepseek-v3"
    fallback_model: "qwen-plus"
    temperature: 0.0
    timeout: 20

  generate:
    provider: dashscope
    model: "deepseek-v3"
    fallback_model: "qwen-plus"
    temperature: 0.1
    timeout: 30

  matcher:
    provider: dashscope
    model: "deepseek-v3"
    fallback_model: "qwen-plus"
    temperature: 0.0
    timeout: 25

  judge: # 独立裁判模型，校验质量门禁与蕴含性
    provider: dashscope
    model: "deepseek-r1"
    fallback_model: "qwen-plus"
    temperature: 0.0
    timeout: 30

  critic:
    provider: dashscope
    model: "deepseek-r1"
    fallback_model: "qwen-plus"
    temperature: 0.0
    timeout: 30

  strategist:
    provider: dashscope
    model: "deepseek-v3"
    fallback_model: "qwen-plus"
    temperature: 0.2
    timeout: 30
